<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="الحساب">
<meta name="theme-color" content="#F3F6FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121A26" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>برامج الحساب للأطفال</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&display=swap">
<style>
:root{
  color-scheme:light dark;
  --bg:#F3F6FC; --surface:#FFFFFF; --ink:#17212E; --ink-soft:#56657F; --line:#CDD8EC;
  --plus:#2E8B57; --times:#7B61FF; --adventure:#E4572E;
  --font:'Baloo Bhaijaan 2','Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121A26; --surface:#1C2736; --ink:#EAF1FB; --ink-soft:#9FB0C8; --line:#2C3A4E;
    --plus:#49C684; --times:#A392FF; --adventure:#FF8A5C;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font);
  padding:max(18px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px))
          max(24px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex; flex-direction:column; gap:20px; align-items:center;
}
header{text-align:center; margin-top:8px}
h1{margin:0; font-size:clamp(26px,5.4vw,42px); font-weight:800}
p.sub{margin:6px 0 0; color:var(--ink-soft); font-size:clamp(15px,2.6vw,20px); font-weight:600}
main{width:100%; max-width:760px; display:flex; flex-direction:column; gap:16px}
a.card{
  display:flex; align-items:center; gap:18px; min-height:116px;
  background:var(--surface); border:2px solid var(--line); border-radius:22px;
  padding:18px 22px; text-decoration:none; color:inherit;
  box-shadow:0 4px 0 var(--line); transition:transform .08s ease;
}
a.card:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line)}
a.card:focus-visible{outline:4px solid var(--times); outline-offset:3px}
.sign{
  flex:0 0 auto; width:76px; height:76px; border-radius:20px;
  display:grid; place-items:center; color:#fff;
  font-size:46px; font-weight:800; line-height:1;
}
.t1 .sign{background:var(--plus)} .t2 .sign{background:var(--times)} .t3 .sign{background:var(--adventure)}
.txt{display:flex; flex-direction:column; gap:4px; min-width:0}
.title{font-size:clamp(20px,3.6vw,28px); font-weight:800}
.desc{font-size:clamp(14px,2.4vw,18px); color:var(--ink-soft); font-weight:600}
footer{color:var(--ink-soft); font-size:14px; font-weight:600; text-align:center; margin-top:auto; padding-top:10px}
</style>
</head>
<body>
<header>
  <h1>هيا نتعلّم الحساب</h1>
  <p class="sub">اختر البرنامج الذي تريد اللعب به</p>
</header>

<main>
  <a class="card t1" href="addition-tables.html">
    <span class="sign" aria-hidden="true">+−</span>
    <span class="txt">
      <span class="title">جداول الجمع والناقص</span>
      <span class="desc">تعلّم الجمع والطرح حتى 20، درسًا بعد درس</span>
    </span>
  </a>

  <a class="card t2" href="multiplication.html">
    <span class="sign" aria-hidden="true">×</span>
    <span class="txt">
      <span class="title">جداول الضرب</span>
      <span class="desc">تعرّف على الضرب وتدرّب على الجداول</span>
    </span>
  </a>

  <a class="card t3" href="addition-adventure.html">
    <span class="sign" aria-hidden="true">★</span>
    <span class="txt">
      <span class="title">مغامرة الجمع</span>
      <span class="desc">لعبة مراحل ممتعة للجمع حتى 20</span>
    </span>
  </a>
</main>

<footer>اضغط على أي بطاقة لتبدأ · للرجوع هنا استخدم زر الرجوع في البرنامج</footer>
</body>
</html>
